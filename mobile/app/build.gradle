plugins {
    id 'com.android.application'
}

android {
    namespace 'com.masmgames.randommaze'
    compileSdk 35

    defaultConfig {
        applicationId 'com.masmgames.randommaze'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']
}
